<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:Geist,system-ui,sans-serif;color:#0E0E0E;background:#fff;position:relative;-webkit-font-smoothing:antialiased}
  .glow{position:absolute;inset:0;background:
     radial-gradient(620px 420px at 100% 100%,rgba(91,140,255,.30),transparent 70%),
     radial-gradient(520px 360px at 82% 8%,rgba(47,98,224,.10),transparent 70%);}
  .dots{position:absolute;right:-40px;bottom:-60px;width:560px;height:560px;opacity:.55;
     background-image:radial-gradient(circle,#2F62E0 1.6px,transparent 1.8px);background-size:22px 22px;
     -webkit-mask-image:radial-gradient(circle at 70% 70%,#000 0,transparent 62%);mask-image:radial-gradient(circle at 70% 70%,#000 0,transparent 62%)}
  .wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:14px;font-weight:600;font-size:34px;letter-spacing:-.02em}
  .brand img{width:48px;height:48px}
  h1{margin-top:auto;font-weight:600;font-size:86px;line-height:1.02;letter-spacing:-.045em;max-width:1000px}
  h1 em{font-style:normal;color:#2F62E0}
  p{margin-top:26px;font-size:30px;line-height:1.3;color:#4a4f5a;max-width:900px;letter-spacing:-.01em}
  .url{margin-top:44px;font-family:'Geist Mono',monospace;font-size:22px;color:#6b7280;letter-spacing:.01em}
</style></head>
<body>
<div class="glow"></div><div class="dots"></div>
<div class="wrap">
  <div class="brand"><img id="logo" alt="">aldia</div>
  <h1 id="h"></h1>
  <p id="s"></p>
  <div class="url">aldiaproject.es</div>
</div>
<script>
  const P = {
    inicio:    ['Automatiza hoy.<br><em>Lidera mañana.</em>', 'Auditoría, automatización con IA, agentes y apps a medida para empresas.'],
    servicios: ['El trabajo repetitivo,<br><em>hecho solo.</em>', 'Automatización con IA, agentes de WhatsApp, apps a medida y webs que convierten.'],
    saas:      ['De la idea<br><em>al primer cobro.</em>', 'Diseñamos, construimos y lanzamos tu SaaS de suscripción.'],
    comunidad: ['Aldia Community.<br><em>Gratis en Discord.</em>', 'Herramientas de IA, retos y noticias explicadas sin humo.'],
    auditoria: ['¿Cuántas horas pierde<br><em>tu equipo?</em>', 'Auditoría gratuita: te decimos qué automatizar y cuánto te ahorra.']
  };
  const q = new URLSearchParams(location.search);
  const [h, s] = P[q.get('p')] || P.inicio;
  document.getElementById('h').innerHTML = h;
  document.getElementById('s').textContent = s;
  document.getElementById('logo').src = q.get('logo');
</script>
</body></html>
